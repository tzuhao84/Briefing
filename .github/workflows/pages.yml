name: Build and deploy briefing

on:
  push:
    branches: [main]
  schedule:
    # Every 6 hours at 00:05, 06:05, 12:05 and 18:05 Taipei time (UTC+8). Cron runs in UTC.
    - cron: "5 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      force_twse:
        description: "Use TWSE instead of Yahoo for Taiwan stocks (to test the fallback)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          FORCE_TWSE: ${{ inputs.force_twse }}
      # Publish dist/ as the only commit on the gh-pages branch, which GitHub Pages serves.
      - name: Push to gh-pages
        working-directory: dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Briefing for $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
